<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS OB Golf 2026</title>
<style>
:root{
  --bg:#f6f7f5;--card:#fff;--line:#e3e6e1;--text:#1d2420;--muted:#6b756f;
  --green:#2d6a4f;--green-soft:#e6f2ec;--gold:#b8892b;--red:#c0392b;--blue:#2c5d8f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{background:var(--green);color:#fff;padding:14px 16px 0}
header h1{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#sync{font-size:12px;font-weight:400;opacity:.9;white-space:nowrap}
#sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#aaa}
#sync.on::before{background:#5fdc8f}#sync.off::before{background:#f0b44c}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
nav button{background:none;border:0;color:#cfe5d9;padding:9px 12px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#f2d27a;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{background:#f1f3f0;font-weight:600;font-size:13px}
td.n,th.n{text-align:right}
tr.sub td{background:#f7f9f6;font-weight:600}
input,select{font:inherit;padding:5px 7px;border:1px solid #cdd3cc;border-radius:6px;background:#fff;color:var(--text);min-width:0}
input.num{width:72px;text-align:right}
input.wide{width:100%}
button.b{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--green);background:var(--green);color:#fff;cursor:pointer}
button.b.ghost{background:#fff;color:var(--green)}
button.x{border:0;background:none;color:var(--red);cursor:pointer;font-size:16px;padding:2px 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:var(--green-soft);color:var(--green);margin-left:4px}
.tag.g{background:#fbf1dc;color:var(--gold)}
.up{color:var(--blue)}.dn{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}main{padding:12px}}
.mx td{text-align:center;min-width:34px}
.mx th{text-align:center}
.hint{background:#fbf8ee;border:1px solid #efe2bb;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
</style>
</head>

function clone(o){return JSON.parse(JSON.stringify(o))}

function normalize(d){

  d.members=d.members||[];d.rounds=d.rounds||[];d.ledger=d.ledger||[];d.headcount=d.headcount||12;
  d.rounds.forEach(r=>{r.groups=r.groups||[];r.groups.forEach(g=>g.players=g.players||[]);r.scores=r.scores||{};r.awards=(r.awards||[]).map(a=>({...a,winners:a.winners||[]}))});

}

/* ===================== 계산 ===================== */
const won=n=>(n<0?"-":"")+Math.abs(Math.round(n)).toLocaleString("ko-KR");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const memberNames=()=>S.members.map(m=>m.name);
const isMember=n=>memberNames().includes(n);
const rLabel=(r,i)=>`${i+1}차 · ${+r.date.slice(5,7)}/${+r.date.slice(8,10)}`;
const players=r=>r.groups.flatMap(g=>g.players).filter(Boolean);
const sortedRounds=()=>S.rounds.map((r,i)=>({r,i})).sort((a,b)=>a.r.date.localeCompare(b.r.date));

function stats(){
  const res={};
  S.members.forEach(m=>res[m.name]={name:m.name,n:0,sum:0,avg:null,best:m.best||null,bestNote:m.bestNote||"",attend:0});
  sortedRounds().forEach(({r})=>{
    players(r).forEach(p=>{if(res[p])res[p].attend++});
    Object.entries(r.scores).forEach(([p,s])=>{
      if(!res[p]||!s)return; const x=res[p]; x.n++; x.sum+=s;
      if(x.best==null||s<x.best){x.best=s;x.bestNote=`${r.date.slice(2,4)}.${+r.date.slice(5,7)}월`}
    });
  });
  const arr=Object.values(res);arr.forEach(x=>x.avg=x.n?x.sum/x.n:null);
  const ranked=arr.filter(x=>x.avg!=null).sort((a,b)=>a.avg-b.avg);
  ranked.forEach((x,k)=>x.rank=k+1);
  return arr;
}
function improvement(ri){   // 해당 라운드 직전까지 누적 평균 대비 개선 타수
  const target=S.rounds[ri];const prev={};
  sortedRounds().forEach(({r,i})=>{if(r.date<target.date)Object.entries(r.scores).forEach(([p,s])=>{if(s){prev[p]=prev[p]||[];prev[p].push(s)}})});
  return Object.entries(target.scores).filter(([p,s])=>s&&isMember(p)&&prev[p]).map(([p,s])=>{const a=prev[p].reduce((x,y)=>x+y,0)/prev[p].length;return{p,s,a,d:a-s}}).sort((x,y)=>y.d-x.d);
}
function monthly(){
  const months=[...new Set(S.ledger.map(e=>e.month))].sort();
  let bal=0;const out=[];const perList=[];
  months.forEach(m=>{
    const es=S.ledger.filter(e=>e.month===m);
    const inc=es.filter(e=>e.amount>0).reduce((a,e)=>a+e.amount,0);
    const out_=es.filter(e=>e.amount<0).reduce((a,e)=>a-e.amount,0);
    bal+=inc-out_;
    const rs=S.rounds.filter(r=>r.date.slice(0,7)===m);
    const heads=rs.reduce((a,r)=>a+players(r).length,0);
    const pp=es.filter(e=>PER_PERSON_CATS.includes(e.cat)).reduce((a,e)=>a-e.amount,0);
    let per=null,cum=null;
    if(rs.length&&heads){per=pp/heads;perList.push(per);cum=perList.reduce((a,b)=>a+b,0)/perList.length}
    out.push({m,inc,out:out_,bal,heads,per,cum,rounds:rs.length});
  });
  return out;
}
function mates(){
  const names=memberNames();const M={};names.forEach(a=>{M[a]={};names.forEach(b=>M[a][b]=0)});
  S.rounds.forEach(r=>r.groups.forEach(g=>{const ps=g.players.filter(isMember);ps.forEach(a=>ps.forEach(b=>{if(a!==b)M[a][b]++}))}));
  return M;
}

function setPath(path,val){
  const k=path.split(".");let o=S;
  for(let i=0;i<k.length-1;i++){o=o[k[i]]}
  o[k[k.length-1]]=val;
}

  const p=t.dataset.path;if(!p)return;
  let v=t.value;
  if(t.dataset.list)v=v.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  else if(t.type==="number")v=v===""?null:Number(v);
  if(/\.scores\./.test(p)&&v==null){const k=p.split(".");delete S.rounds[k[1]].scores[k.slice(3).join(".")]}
  else setPath(p,v);
  save();render();
});
